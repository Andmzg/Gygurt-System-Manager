<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
    body { font-family: 'Montserrat', sans-serif; color: #333; padding: 40px; }
    
    /* CABECERA */
    .header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 30px; 
      border-bottom: 3px solid #00A99D; 
      padding-bottom: 15px; 
    }
    
    /* El logo se inserta desde Logo.html, aquí solo controlamos su contenedor si fuera necesario */
    .logo-img { width: 120px; height: auto; display: block; }

    .title { 
      color: #00A99D; 
      font-size: 24px; 
      font-weight: bold; 
      letter-spacing: 2px; 
      text-transform: uppercase; 
    }
    
    /* CAJA DE INFO */
    .info-box { background: #f4fcfb; padding: 15px; border-radius: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; border: 1px solid #e0f2f1; }
    .info-row { margin-bottom: 5px; font-size: 12px; }
    
    .label { 
      font-weight: bold; 
      color: #00A99D; /* Verde Gygurt */
      text-transform: uppercase; 
      font-size: 10px; 
      letter-spacing: 1px; 
    }
    
    /* TABLA */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    
    th { 
      background-color: #00A99D; /* Fondo Verde */
      color: white;              
      font-size: 10px; 
      text-transform: uppercase; 
      padding: 10px; 
      text-align: left; 
      border-radius: 4px 4px 0 0; 
    }
    
    td { padding: 10px; border-bottom: 1px solid #eee; font-size: 12px; color: #444; }
    tr:last-child td { border-bottom: none; }
    
    /* TOTALES */
    .totals-section { margin-top: 20px; display: flex; justify-content: flex-end; }
    .total-box { border: 2px solid #00A99D; padding: 15px; border-radius: 8px; min-width: 180px; background: #fff; }
    .total-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; }
    
    .final { font-weight: bold; font-size: 16px; color: #00A99D; border-top: 1px solid #ddd; padding-top: 5px; margin-top: 5px; }
    
    /* Footer */
    .footer { margin-top: 40px; text-align: center; font-size: 9px; color: #00A99D; border-top: 1px solid #eee; padding-top: 10px; }
  </style>
</head>
<body>

  <div class="header">
    <?!= include('Logo'); ?>
    
    <div class="title">NOTA DE ENTREGA</div>
  </div>

  <div class="info-box">
    <div>
      <div class="info-row"><span class="label">Nota No:</span> <strong style="font-size:1.2em">#<?= orderId ?></strong></div>
      <div class="info-row"><span class="label">Cliente:</span> <strong><?= clientName ?></strong></div>
    </div>
    <div style="text-align: right;">
      <div class="info-row"><span class="label">Fecha:</span> <?= date ?></div>
      <div class="info-row"><span class="label">Estado:</span> PENDIENTE DE PAGO</div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="text-align: center;">Cant.</th>
        <th>Descripción</th>
        <th style="text-align: right;">Precio Unit.</th>
        <th style="text-align: right;">Total</th>
      </tr>
    </thead>
    <tbody>
      <? for (var i = 0; i < items.length; i++) { ?>
      <tr>
        <td style="text-align: center; font-weight:bold;"><?= items[i].quantity ?></td>
        <td><?= items[i].productData.name ?> <span style="color:#999; font-size:0.9em">(<?= items[i].presentation ?>)</span></td>
        <td style="text-align: right;">$<?= parseFloat(items[i].unitPrice).toFixed(2) ?></td>
        <td style="text-align: right;">$<?= (items[i].quantity * items[i].unitPrice).toFixed(2) ?></td>
      </tr>
      <? } ?>
    </tbody>
  </table>

  <div class="totals-section">
    <div class="total-box">
      <div class="total-row"><span>Total Unidades:</span> <span><?= totalQty ?></span></div>
      
      <div class="total-row final"><span>TOTAL A PAGAR:</span> <span>$<?= totalAmount ?></span></div>
    </div>
  </div>

  <div class="footer">
    Gracias por su compra • Gygurt Yogurt Griego
  </div>
</body>
</html>
